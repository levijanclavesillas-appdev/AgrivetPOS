# Chachi POS web — shared by every store's vhost (TASK-062). store.sh installs this as
# /etc/nginx/conf.d/chachi-pos.conf (the rate-limit zone, http context) and the proxy
# lines as /etc/nginx/snippets/chachi-pos-proxy.conf.
limit_req_zone $binary_remote_addr zone=chachi_pos_auth:10m rate=30r/m;

# TASK-073 §3: the renderer is ~715 KB of unminified ES modules and 152 KB of CSS, and
# every byte of it was proxied to a hosted store uncompressed. gzip is the right place
# for this — nginx already terminates TLS here, and the Electron build, which serves the
# same files over loopback, should not pay for compression it does not need.
#
# gzip_proxied any: these responses come back from the app container, so without it
# nginx would leave every proxied byte uncompressed — which is all of them.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    image/svg+xml;
